# Publish the AnxietyWatch ML inference container to GitHub Container Registry,
# then deploy the immutable image to the existing Azure Container App via OIDC.
#
# Triggers:
#   - workflow_dispatch : explicit manual publish (select the `develop` ref). NEVER deploys.
#   - push to develop   : publish the integrated image, then deploy it to Azure.
#   - pull_request      : build-only validation, NEVER pushes to GHCR and NEVER deploys.
#
# Every publish carries an immutable Git SHA tag. Pushes to develop also get a
# moving `develop` tag for reference, but Azure deployments ALWAYS use the
# immutable full-SHA tag (github.sha) — never `latest` and never `develop`.
#
# Effective ordering for a push to develop:
#
#   quality-gate (ruff + compileall + pytest for the SAME github.sha)
#        ↓ PASS
#   build-and-publish (Docker build + GHCR publish :<full SHA>)
#        ↓
#   deploy-azure (OIDC login -> image-only update -> revision wait ->
#                 /health verification)
#
# If quality-gate fails, neither the image is published nor Azure is touched.
# The authoritative quality commands are duplicated here (rather than relying
# on the separate ci.yml workflow) so that deployment is impossible unless the
# tests for the deployed commit passed. A later task may refactor this into a
# reusable workflow/action.
#
# Azure authentication uses GitHub OIDC (federated credential on
# sp-anxietywatch-github-dev). No client secret and no credential files are used.

name: Publish ML Inference Container (GHCR + Azure CD)

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/anxietywatch-org/anxietywatch-ml-api

jobs:
  quality-gate:
    name: Quality + Test (deployment gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff quality gate (clean subset)
        run: python -m ruff check src tests --config .ruff-ci.toml

      - name: Package import smoke
        run: python -m compileall -q src

      - name: Tests
        run: python -m pytest tests/ -q

  build-and-publish:
    name: Build (+ Publish) image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=sha,prefix=,format=short
            type=raw,value=develop,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure:
    name: Deploy to Azure Container Apps (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      IMAGE_REF: ghcr.io/anxietywatch-org/anxietywatch-ml-api:${{ github.sha }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update existing Container App image (image-only)
        shell: bash
        run: |
          set -euo pipefail
          # The containerapp CLI extension's default preview API (2025-10-02-preview)
          # caused a server-side 400 on containerApps writes during 006-B2.
          # az rest with the proven api-version=2024-10-02-preview avoids that defect.
          # We GET the existing definition and PATCH it back with ONLY the image
          # changed, preserving all existing configuration (env vars, volume mount,
          # probes, ingress, scale, read-only mount).
          SUB="$(az account show --query id -o tsv)"
          BASE="https://management.azure.com/subscriptions/${SUB}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.App/containerApps/${AZURE_CONTAINER_APP_NAME}"
          az rest --method get --url "${BASE}?api-version=2024-10-02-preview" -o json > /tmp/app.json
          jq '
            del(.id, .name, .type, .systemData) |
            .properties |= del(.provisioningState, .latestRevisionName, .latestRevisionFqdn,
                               .latestReadyRevisionName, .customDomainVerificationId,
                               .eventStreamEndpoint, .outboundIPAddresses, .deploymentErrors,
                               .runningStatus, .runningState) |
            .properties.configuration.ingress |= del(.fqdn) |
            .tags = (.tags // {}) |
            .properties.template.containers[0].image = $img
          ' --arg img "${IMAGE_REF}" /tmp/app.json > /tmp/app-patch.json
          az rest --method patch --url "${BASE}?api-version=2024-10-02-preview" --body @/tmp/app-patch.json -o json > /tmp/app-after.json
          echo "PATCH accepted."

      - name: Wait for new revision and verify image
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          SUB="$(az account show --query id -o tsv)"
          BASE="https://management.azure.com/subscriptions/${SUB}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.App/containerApps/${AZURE_CONTAINER_APP_NAME}"
          CUR_IMG=""
          NEW_REV=""
          for i in $(seq 1 30); do
            APP="$(az rest --method get --url "${BASE}?api-version=2024-10-02-preview" -o json)"
            CUR_IMG="$(jq -r '.properties.template.containers[0].image' <<<"${APP}")"
            NEW_REV="$(jq -r '.properties.latestRevisionName' <<<"${APP}")"
            echo "poll ${i}: image=${CUR_IMG} revision=${NEW_REV}"
            if [ "${CUR_IMG}" = "${IMAGE_REF}" ] && [ "${NEW_REV}" != "null" ] && [ -n "${NEW_REV}" ]; then
              break
            fi
            sleep 10
          done
          if [ "${CUR_IMG}" != "${IMAGE_REF}" ]; then
            echo "::error::Container App image did not converge to ${IMAGE_REF}"
            exit 1
          fi
          echo "Immutable image confirmed: ${CUR_IMG}"
          PS=""
          for i in $(seq 1 30); do
            R="$(az rest --method get --url "${BASE}/revisions/${NEW_REV}?api-version=2024-10-02-preview" -o json)"
            PS="$(jq -r '.properties.provisioningState' <<<"${R}")"
            RS="$(jq -r '.properties.runningState // ""' <<<"${R}")"
            echo "revision ${NEW_REV} poll ${i}: provisioning=${PS} running=${RS}"
            if [ "${PS}" = "Provisioned" ]; then
              break
            fi
            sleep 10
          done
          if [ "${PS}" != "Provisioned" ]; then
            echo "::error::Revision ${NEW_REV} did not finish provisioning (state=${PS})"
            exit 1
          fi
          STABLE_FQDN="$(jq -r '.properties.configuration.ingress.fqdn // ""' <<<"${APP}")"
          if [ -z "${STABLE_FQDN}" ]; then
            echo "::error::Stable ingress FQDN missing from Container App resource (properties.configuration.ingress.fqdn is empty). Refusing to health-check a fallback URL."
            exit 1
          fi
          echo "revision=${NEW_REV}" >> "${GITHUB_OUTPUT}"
          echo "fqdn=${STABLE_FQDN}" >> "${GITHUB_OUTPUT}"
          echo "Stable app FQDN: ${STABLE_FQDN}"

      - name: Health check (stable FQDN, bounded retries)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ steps.verify.outputs.fqdn }}/health"
          echo "Checking ${URL}"
          ok="0"
          for i in $(seq 1 15); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 90 "${URL}" || true)"
            if [ "${code}" = "200" ] && grep -q '"status":"ok"' /tmp/health.json \
                && grep -q '"model_loaded":true' /tmp/health.json \
                && grep -q '"model_version":"0.1.0"' /tmp/health.json; then
              echo "Health OK (attempt ${i}): HTTP ${code}"
              cat /tmp/health.json
              ok="1"
              break
            fi
            echo "Health attempt ${i}: HTTP ${code}"
            sleep 20
          done
          if [ "${ok}" != "1" ]; then
            echo "::error::Health verification FAILED for ${URL}"
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## Azure Container Apps deployment (OIDC)"
            echo ""
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Image**: \`${IMAGE_REF}\`"
            echo "- **Container App**: \`${AZURE_CONTAINER_APP_NAME}\`"
            echo "- **Revision**: \`${{ steps.verify.outputs.revision }}\`"
            echo "- **Stable FQDN**: https://${{ steps.verify.outputs.fqdn }}"
            echo "- **Health verification**: PASS"
          } >> "${GITHUB_STEP_SUMMARY}"