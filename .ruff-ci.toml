# ruff CI gate — strict clean subset + explicit debt ignore
# 
# This config is used by CI to enforce a green quality gate TODAY
# while documenting known debt that is deferred.
# 
# To harden later: remove entries from `ignore` as debt is paid down.
# Run locally EXACTLY as CI: `python -m ruff check src tests --config .ruff-ci.toml`

line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "PL", "SIM", "T20"]

